[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "reachy_meets_planck"
version = "0.1.0"
description = "Reachy Mini reads Max Planck's first Columbia lecture (1909)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "reachy-mini",
    "numpy",
    "soundfile>=0.13",
    "soxr",
    "vosk",
]
keywords = ["reachy-mini-app"]

[project.optional-dependencies]
# Only needed to (re)generate the speech audio with scripts/render_audio.py.
render = [
    "openai>=2",
    "python-dotenv",
]

[project.entry-points."reachy_mini_apps"]
reachy_meets_planck = "reachy_meets_planck.main:ReachyMeetsPlanck"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["reachy_meets_planck*"]

[tool.setuptools.package-data]
# Planck's text, the performance settings and the compressed speech clips.
reachy_meets_planck = ["data/*.json", "audio/*.ogg", "audio/manifest.json"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc"]
